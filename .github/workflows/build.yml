name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka
      - name: Build NtBar
        run: python -m nuitka --onefile --enable-plugin=pyside6 --windows-console-mode=disable --output-dir=dist --output-filename=NtBar.exe ntbar.py
      - uses: actions/upload-artifact@v4
        with:
          name: NtBar-windows-x64
          path: dist/NtBar.exe
          if-no-files-found: error
          retention-days: 14
